name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Core tests
        run: gradle :shared:test --no-daemon

      - name: Build Android APK
        run: gradle :androidApp:assembleDebug --no-daemon

      - name: Build desktop uber jar
        run: gradle :desktop:packageUberJarForCurrentOS --no-daemon

      - name: Package Tizen and webOS
        run: |
          bash scripts/package-tizen.sh
          bash scripts/package-webos.sh

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk dist/ArchPlayer-1.2.2-android-debug.apk
          cp desktop/build/compose/jars/ArchPlayer-*.jar dist/ArchPlayer-1.2.2-desktop.jar
          cp build/ArchPlayer-tizen.wgt dist/ArchPlayer-1.2.2-tizen.wgt
          cp build/ArchPlayer-webos-unpacked.zip dist/ArchPlayer-1.2.2-webos.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Windows installer
        run: gradle :desktop:packageExe --no-daemon

      - name: Collect artifact
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null; Copy-Item desktop/build/compose/binaries/main/exe/* dist/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
